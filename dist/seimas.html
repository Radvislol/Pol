.sbl { --ink: #0F131B; --bg: #0D1118; --panel: #181E29; --panel2: #212836; --panel3: #2A3242; --line: rgba(255,255,255,.10); --line2: rgba(255,255,255,.18);
  --text: #ECEFF4; --muted: #98A2B3; --sun: #F5A524; --acc: #F5A524; --good: #4ADE80; --bad: #F87171; --warn: #FBBF24;
  color: var(--text); background: var(--bg); font-family: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  position: relative; isolation: isolate; }
.sbl ::selection { background: rgba(245,165,36,.4) }
.sbl ::-webkit-scrollbar { width: 8px; height: 8px } .sbl ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 8px } .sbl ::-webkit-scrollbar-track { background: transparent }
.cx-card { background: linear-gradient(180deg, rgba(34,41,55,.97), rgba(22,27,37,.97)); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: 0 12px 32px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.05); }
.cx-soft { background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.05); border-radius: 10px; }
.cx-panel2 { background: var(--panel2); }
:where(.cx-btn) { display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.cx-btn { border: 1px solid var(--line2); border-radius: 10px; font-weight: 700; color: var(--text); background: var(--panel3);
  cursor: pointer; user-select: none; -webkit-user-select: none; box-shadow: 0 4px 14px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.07);
  transition: transform .08s ease, filter .15s ease, background-color .15s ease, border-color .15s ease; }
.cx-btn:hover:not(:disabled) { filter: brightness(1.1); border-color: rgba(255,255,255,.32); }
.cx-btn:active:not(:disabled) { transform: translateY(1px) scale(.99); }
.cx-btn:disabled { opacity: .38; cursor: not-allowed; }
.cx-btn:focus-visible, .cx-tap:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.cx-cta { font-family: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif; font-style: italic; font-weight: 700; letter-spacing: .015em; }
.cx-tap { cursor: pointer; transition: transform .08s ease, border-color .15s ease, background-color .15s ease; }
.cx-tap:hover { border-color: rgba(255,255,255,.24); }
.cx-tap:active { transform: scale(.99); }
.cx-sun { background: linear-gradient(180deg, #FFBA3F, #EE980F); color: #1B1204; border-color: rgba(0,0,0,.3);
  box-shadow: 0 6px 20px rgba(245,165,36,.25), inset 0 1px 0 rgba(255,255,255,.4); }
.cx-leaf { background: linear-gradient(180deg, #34B26A, #22874D); color: #fff; }
.cx-berry { background: linear-gradient(180deg, #E5484D, #C2353A); color: #fff; }
.cx-white { background: var(--panel3); color: var(--text); }
.cx-pale { background: rgba(255,255,255,.06); color: var(--text); }
.cx-cream { background: linear-gradient(180deg, rgba(245,165,36,.13), rgba(245,165,36,.05)), var(--panel); border-color: rgba(245,165,36,.35); }
.cx-night { background: var(--panel); color: var(--text); }
.cx-quote { background: #F3F4F6; color: #11141B; border: 0; border-radius: 18px; box-shadow: 0 8px 20px rgba(0,0,0,.35); }
.cx-quote:hover:not(:disabled) { background: #fff; transform: translateX(3px); }
.cx-quote:disabled { opacity: .35; }
.cx-quote.cx-sun { background: linear-gradient(180deg, #FFBA3F, #EE980F); }
:where(.cx-chip) { display: inline-flex; align-items: center; gap: 6px; }
.cx-chip { border: 1px solid var(--line2); border-radius: 999px; background: rgba(255,255,255,.06); color: var(--text); font-weight: 700; }
.cx-pill { display: inline-flex; align-items: center; gap: 6px; background: #F3F4F6; color: #11141B; border-radius: 999px;
  font-family: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif; font-weight: 700; font-variant-numeric: tabular-nums; box-shadow: 0 3px 10px rgba(0,0,0,.3); }
.cx-title { font-family: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif; font-style: italic; font-weight: 700; letter-spacing: .005em; text-wrap: balance; }
.truncate { text-wrap: nowrap; }
.cx-num { font-family: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif; font-variant-numeric: tabular-nums; font-weight: 700; }
.cx-kicker { font-family: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif; font-style: italic; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--acc); }
.cx-bar { background: #07090D; color: #fff; }
.t-muted { color: var(--muted); }
.cx-track { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.10); border-radius: 999px; overflow: hidden; }
.cx-logo { font-family: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif; font-style: italic; font-weight: 800; color: #fff; letter-spacing: .01em;
  text-shadow: 0 10px 40px rgba(0,0,0,.7); }
.cx-scene svg { filter: saturate(.82) contrast(1.06); }
.cx-scene svg path, .cx-scene svg rect, .cx-scene svg circle, .cx-scene svg ellipse, .cx-scene svg line, .cx-scene svg polyline { stroke-opacity: .55; }
.cx-map-dark path, .cx-map-dark circle { transition: fill .35s ease }
.cx-wheel { transition: transform 3.4s cubic-bezier(.12,.75,.12,1); transform-box: fill-box; transform-origin: center; }
.cx-ticker-wrap { overflow: hidden; white-space: nowrap; }
.cx-ticker { display: inline-flex; gap: 32px; padding-left: 100%; animation: cx-ticker 38s linear infinite; }
@keyframes cx-ticker { from { transform: translateX(0) } to { transform: translateX(-100%) } }
@keyframes cx-up { from { transform: translateY(32px); opacity: 0 } to { transform: none; opacity: 1 } }
@keyframes cx-fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes cx-pop { 0% { transform: scale(.7); opacity: 0 } 70% { transform: scale(1.06) } 100% { transform: scale(1); opacity: 1 } }
@keyframes cx-bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
@keyframes cx-glow { 0% { box-shadow: 0 0 0 0 rgba(245,165,36,.75) } 100% { box-shadow: 0 0 0 16px rgba(245,165,36,0) } }
@keyframes cx-blink { 0%, 100% { opacity: 1 } 50% { opacity: .4 } }
@keyframes cx-fall { 0% { transform: translateY(-12vh) rotate(0deg) } 100% { transform: translateY(112vh) rotate(760deg) } }
@keyframes cx-shake { 0%, 100% { transform: translateX(0) } 25% { transform: translateX(-6px) } 75% { transform: translateX(6px) } }
.sbl-sheet { animation: cx-up .3s cubic-bezier(.2,.9,.3,1.2) both }
.sbl-fade { animation: cx-fade .2s ease both }
.sbl-pop { animation: cx-pop .35s ease both }
.sbl-toast { animation: cx-pop .25s ease both }
.sbl-blink { animation: cx-blink 1.2s ease-in-out infinite }
.cx-shake { animation: cx-shake .35s ease 2 }
.cx-bob { animation: cx-bob 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: center }
.cx-glow { animation: cx-glow 1.3s ease-out infinite }
.cx-confetti { position: fixed; top: 0; width: 9px; height: 14px; border-radius: 2px; z-index: 70; pointer-events: none; animation: cx-fall linear forwards; }
.sbl-scroll { -webkit-overflow-scrolling: touch; overscroll-behavior: contain }
.cx-map path, .cx-map circle { transition: fill .35s ease }
@keyframes cx-ping { 0% { transform: scale(1); opacity: .7 } 100% { transform: scale(2.3); opacity: 0 } }
@keyframes cx-dash { to { stroke-dashoffset: -38 } }
.cx-ping { animation: cx-ping 1.5s ease-out infinite; transform-box: fill-box; transform-origin: center }
.cx-pop-svg { animation: cx-pop .45s ease both; transform-box: fill-box; transform-origin: center }
.cx-travel { transition: transform .9s cubic-bezier(.5,0,.3,1) }
.cx-dash { stroke-dasharray: 10 9; animation: cx-dash 1.2s linear infinite }
.cx-layers { scrollbar-width: none } .cx-layers::-webkit-scrollbar { display: none }
@keyframes cx-kb { 0% { transform: scale(1) translate(0, 0) } 100% { transform: scale(1.12) translate(-2%, -1.5%) } }

tment fund and affordable rental housing.","Region\u0173 investicij\u0173 fondas ir \u012Fperkamas nuomojamas b\u016Bstas."),style:"welfare",base:6,axis:["econ",-1],tags:[["rural",.6]]},{t:o("Lower income tax for young professionals under 30.","Ma\u017Eesnis pajam\u0173 mokestis jauniems specialistams iki 30 met\u0173."),style:"business",base:6,axis:["econ",1],tags:[["urban",.6],["ABR",1.5]]},{t:o("Dual citizenship and a real diaspora strategy.","Dviguba pilietyb\u0117 ir tikra diasporos strategija."),style:"youth",base:6,tags:[["ABR",2.5],["urban",.3]]}]},{q:o("Should owners of second and third homes pay a progressive property tax?","Ar antr\u0173j\u0173 ir tre\u010Di\u0173j\u0173 b\u016Bst\u0173 savininkai tur\u0117t\u0173 mok\u0117ti progresin\u012F nekilnojamojo turto mokest\u012F?"),answers:[{t:o("Yes. Someone with three flats can pay more than a nurse.","Taip. Turintis tris butus gali mok\u0117ti daugiau nei slaugytoja."),style:"welfare",base:6,axis:["econ",-1],tags:[["urban",.4],["rural",.5]]},{t:o("No. Taxing savings punishes the middle class.","Ne. Apmokestinti santaupas \u2013 bausti vidurin\u0119 klas\u0119."),style:"business",base:6,axis:["econ",1],tags:[["urban",.7]]},{t:o("Only after we fix the property register and close the loopholes.","Tik sutvark\u0119 turto registr\u0105 ir u\u017Ekam\u0161\u0119 spragas."),style:"technocrat",base:5.5,tags:[["all",.3]]},{t:o("Tax the banks before you tax families!","Pirma apmokestinkite bankus, o ne \u0161eimas!"),style:"populist",base:6,axis:["econ",-1],tags:[["rural",.7]],pc:-1}]},{q:o("Small towns are emptying while Vilnius booms. What is your plan for the regions?","Miesteliai tu\u0161t\u0117ja, o Vilnius klesti. Koks j\u016Bs\u0173 planas regionams?"),answers:[{t:o("Move state agencies out of Vilnius and pay a regional bonus.","I\u0161kelti valstyb\u0117s \u012Fstaigas i\u0161 Vilniaus ir mok\u0117ti regionin\u012F pried\u0105."),style:"welfare",base:6,axis:["econ",-1],tags:[["rural",1],["VNO",-.5]]},{t:o("Zero profit tax for five years for firms that invest in the regions.","Penkerius metus jokio pelno mokes\u010Dio regionuose investuojan\u010Dioms \u012Fmon\u0117ms."),style:"business",base:6,axis:["econ",1],tags:[["rural",.6],["urban",.3]]},{t:o("Fast trains: Rail Baltica stops in every county seat.","Greiti traukiniai: \u201ERail Baltica\u201C sustos kiekviename apskrities centre."),style:"technocrat",base:5.5,tags:[["all",.4]]},{t:o("The Vilnius elite forgot you. We won\u2019t.","Vilniaus elitas jus pamir\u0161o. Mes \u2013 ne."),style:"populist",base:6,tags:[["rural",.9],["VNO",-.7]]}]},{q:o("Thirty seconds. Why should an undecided voter in Panev\u0117\u017Eys trust you?","Trisde\u0161imt sekund\u017Ei\u0173. Kod\u0117l neapsisprend\u0119s rink\u0117jas Panev\u0117\u017Eyje tur\u0117t\u0173 jumis pasitik\u0117ti?"),answers:[{t:o("A calm promise: competent, honest government for every region.","Ramus pa\u017Eadas: kompetentinga ir s\u0105\u017Eininga vald\u017Eia kiekvienam regionui."),style:"moderate",base:6,tags:[["all",.3]]},{t:o("A fiery speech against the Vilnius elites.","Ugninga kalba prie\u0161 Vilniaus elit\u0105."),style:"populist",base:6,tags:[["rural",.8],["urban",-.5]]},{t:o("Three concrete, costed pledges, read straight to camera.","Trys konkret\u016Bs, apskai\u010Diuoti pa\u017Eadai \u2013 tiesiai \u012F kamer\u0105."),style:"technocrat",base:6,tags:[["urban",.5]]}]}]},{title:o("Security & Foreign Policy","Saugumas ir u\u017Esienio politika"),questions:[{q:o("Should defence spending rise to 5\u20136% of GDP, even if it means new taxes?","Ar kra\u0161to apsaugai reikia skirti 5\u20136 % BVP, net jei tam prireiks nauj\u0173 mokes\u010Di\u0173?"),answers:[{t:o("Yes. Security has no price: 6% now.","Taip. Saugumas neturi kainos \u2013 6 % jau dabar."),style:"security",base:6,axis:["defense",1],tags:[["VNO",.8],["border",.6]]},{t:o("Yes, but paid for by a bank-profit tax, not by families.","Taip, bet sumok\u0117s bank\u0173 pelno mokestis, o ne \u0161eimos."),style:"welfare",base:6.5,axis:["econ",-1],tags:[["all",.4]]},{t:o("We need balance: 4%, and invest the rest in people.","Reikia pusiausvyros: 4 %, o likusius \u2013 \u017Emon\u0117ms."),style:"populist",base:5.5,axis:["defense",-1],tags:[["rural",.6],["VNO",-.8]]}]},{q:o("Belarus keeps sending smuggling balloons and migrants. What is your red line?","Baltarusija toliau siun\u010Dia kontrabandos balionus ir migrantus. Kur j\u016Bs\u0173 raudonoji linija?"),answers:[{t:o("Close the border until it stops. Full stop.","U\u017Edaryti sien\u0105, kol tai liausis. Ta\u0161kas."),style:"security",base:6,axis:["defense",1],tags:[["border",1]]},{t:o("Coordinated EU sanctions and modern airspace defence.","Koordinuotos ES sankcijos ir moderni oro erdv\u0117s gynyba."),style:"moderate",base:6,tags:[["urban",.5]]},{t:o("De-escalate through diplomatic channels.","Ma\u017Einti \u012Ftamp\u0105 diplomatiniais kanalais."),style:"technocrat",base:4.5,axis:["defense",-1],tags:[["border",-.8]]}]},{q:o("Should every 18-year-old, men and women, do military service?","Ar kiekvienas 18-metis \u2013 ir vaikinai, ir merginos \u2013 tur\u0117t\u0173 atlikti karo tarnyb\u0105?"),answers:[{t:o("Yes. Universal service, like Finland.","Taip. Visuotin\u0117 tarnyba, kaip Suomijoje."),style:"security",base:5.5,axis:["defense",1],tags:[["urban",.3]]},{t:o("Expand it for men, keep it voluntary for women.","Pl\u0117sti vaikinams, merginoms \u2013 savanori\u0161kai."),style:"traditional",base:6,axis:["social",1],tags:[["rural",.5]]},{t:o("No. Build a professional army instead.","Ne. Kurkime profesionali\u0105 kariuomen\u0119."),style:"youth",base:5.5,axis:["defense",-1],tags:[["urban",.4]]}]},{q:o("Ukraine asks for more air defence. Should we send systems we still need ourselves?","Ukraina pra\u0161o daugiau oro gynybos. Ar si\u0173sti sistemas, kuri\u0173 patiems dar reikia?"),answers:[{t:o("Yes. Ukraine\u2019s fight is our fight.","Taip. Ukrainos kova \u2013 m\u016Bs\u0173 kova."),style:"security",base:6,axis:["defense",1],tags:[["VNO",.8],["urban",.4]]},{t:o("Help with money and training, but keep our own shield.","Pad\u0117ti pinigais ir mokymais, bet i\u0161laikyti savo skyd\u0105."),style:"moderate",base:6,tags:[["all",.4]]},{t:o("Our own villages come first.","Pirmiausia \u2013 m\u016Bs\u0173 pa\u010Di\u0173 kaimai."),style:"populist",base:5.5,axis:["defense",-1],tags:[["rural",.6],["VNO",-.8]],pc:-1}]},{q:o("Russian disinformation floods social media before the vote. How do you fight back?","Prie\u0161 rinkimus socialinius tinklus u\u017Elieja Rusijos dezinformacija. Kaip kovosite?"),answers:[{t:o("A media literacy course in every school.","Medij\u0173 ra\u0161tingumo pamokos kiekvienoje mokykloje."),style:"youth",base:6,tags:[["urban",.6]]},{t:o("Block the channels and fine the platforms hard.","Blokuoti kanalus ir skirti platformoms dideles baudas."),style:"security",base:6,axis:["defense",1],tags:[["VNO",.5],["border",.4]]},{t:o("Trust people: free speech, not censorship.","Pasitik\u0117ti \u017Emon\u0117mis: \u017Eod\u017Eio laisv\u0117, ne cenz\u016Bra."),style:"populist",base:5.5,tags:[["rural",.5],["urban",-.3]]}]}]},{title:o("Values, Energy & the Future","Vertyb\u0117s, energetika ir ateitis"),closing:!0,questions:[{q:o("Will your government pass the civil partnership law?","Ar j\u016Bs\u0173 Vyriausyb\u0117 priims partneryst\u0117s \u012Fstatym\u0105?"),answers:[{t:o("Yes: equal recognition for every family.","Taip \u2013 lygios teis\u0117s kiekvienai \u0161eimai."),style:"progressive",base:6,axis:["social",-1],tags:[["urban",1],["rural",-.8]]},{t:o("A narrow cohabitation agreement, not partnership.","Siaura bendro gyvenimo sutartis, ne partneryst\u0117."),style:"moderate",base:6,tags:[["all",.3]]},{t:o("No. We protect the traditional family.","Ne. Ginsime tradicin\u0119 \u0161eim\u0105."),style:"traditional",base:6,axis:["social",1],tags:[["rural",1],["urban",-.8]]}]},{q:o("Energy: offshore wind, a new nuclear plant, or cheap gas?","Energetika: j\u016Bros v\u0117jas, nauja atomin\u0117 ar pigios dujos?"),answers:[{t:o("Offshore wind and solar: green independence.","J\u016Bros v\u0117jas ir saul\u0117 \u2013 \u017Ealioji nepriklausomyb\u0117."),style:"green",base:6,axis:["green",1],tags:[["urban",.7],["KLP",.8]]},{t:o("Small modular reactors at Visaginas.","Ma\u017Ei moduliniai reaktoriai Visagine."),style:"technocrat",base:6,axis:["green",1],tags:[["UTE",2.5]]},{t:o("Keep gas cheap and stop the green experiments.","I\u0161laikyti pigias dujas ir baigti \u017Ealiuosius eksperimentus."),style:"populist",base:6,axis:["green",-1],tags:[["rural",.8],["urban",-.6]]}]},{q:o("Should Lithuania move to a four-day working week?","Ar Lietuvai pereiti prie keturi\u0173 dien\u0173 darbo savait\u0117s?"),answers:[{t:o("Yes, starting with a public-sector pilot next year.","Taip, pradedant bandomuoju projektu vie\u0161ajame sektoriuje kitais metais."),style:"progressive",base:6,axis:["econ",-1],tags:[["urban",.7]]},{t:o("Productivity first. Shorter weeks will follow.","Pirmiausia na\u0161umas. Trumpesn\u0117 savait\u0117 ateis v\u0117liau."),style:"business",base:6,axis:["econ",1],tags:[["urban",.4]]},{t:o("Families need time together: yes, and keep Sundays free.","\u0160eimoms reikia laiko kartu: taip, ir sekmadieniai turi likti laisvi."),style:"traditional",base:5.5,axis:["social",1],tags:[["rural",.6]]},{t:o("Fine, but raise pensions first.","Gerai, bet pirmiausia pakelkime pensijas."),style:"welfare",base:5.5,tags:[["rural",.7]]}]},{q:o("Climate: should petrol and diesel cars be taxed more?","Klimatas: ar benzininius ir dyzelinius automobilius reikia apmokestinti labiau?"),answers:[{t:o("Yes, and spend every cent on public transport.","Taip, ir kiekvien\u0105 cent\u0105 skirti vie\u0161ajam transportui."),style:"green",base:6,axis:["green",1],tags:[["urban",.8],["rural",-.6]]},{t:o("No new taxes on people who must drive to work.","Joki\u0173 nauj\u0173 mokes\u010Di\u0173 tiems, kam \u012F darb\u0105 tenka va\u017Ei
