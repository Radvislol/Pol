and migrants. What is your red line?","Baltarusija toliau siun\u010Dia kontrabandos balionus ir migrantus. Kur j\u016Bs\u0173 raudonoji linija?"),answers:[{t:a("Close the border until it stops. Full stop.","U\u017Edaryti sien\u0105, kol tai liausis. Ta\u0161kas."),style:"security",base:6,axis:["defense",1],tags:[["border",1]]},{t:a("Coordinated EU sanctions and modern airspace defence.","Koordinuotos ES sankcijos ir moderni oro erdv\u0117s gynyba."),style:"moderate",base:6,tags:[["urban",.5]]},{t:a("De-escalate through diplomatic channels.","Ma\u017Einti \u012Ftamp\u0105 diplomatiniais kanalais."),style:"technocrat",base:4.5,axis:["defense",-1],tags:[["border",-.8]]}]},{q:a("Should every 18-year-old, men and women, do military service?","Ar kiekvienas 18-metis \u2013 ir vaikinai, ir merginos \u2013 tur\u0117t\u0173 atlikti karo tarnyb\u0105?"),answers:[{t:a("Yes. Universal service, like Finland.","Taip. Visuotin\u0117 tarnyba, kaip Suomijoje."),style:"security",base:5.5,axis:["defense",1],tags:[["urban",.3]]},{t:a("Expand it for men, keep it voluntary for women.","Pl\u0117sti vaikinams, merginoms \u2013 savanori\u0161kai."),style:"traditional",base:6,axis:["social",1],tags:[["rural",.5]]},{t:a("No. Build a professional army instead.","Ne. Kurkime profesionali\u0105 kariuomen\u0119."),style:"youth",base:5.5,axis:["defense",-1],tags:[["urban",.4]]}]},{q:a("Ukraine asks for more air defence. Should we send systems we still need ourselves?","Ukraina pra\u0161o daugiau oro gynybos. Ar si\u0173sti sistemas, kuri\u0173 patiems dar reikia?"),answers:[{t:a("Yes. Ukraine\u2019s fight is our fight.","Taip. Ukrainos kova \u2013 m\u016Bs\u0173 kova."),style:"security",base:6,axis:["defense",1],tags:[["VNO",.8],["urban",.4]]},{t:a("Help with money and training, but keep our own shield.","Pad\u0117ti pinigais ir mokymais, bet i\u0161laikyti savo skyd\u0105."),style:"moderate",base:6,tags:[["all",.4]]},{t:a("Our own villages come first.","Pirmiausia \u2013 m\u016Bs\u0173 pa\u010Di\u0173 kaimai."),style:"populist",base:5.5,axis:["defense",-1],tags:[["rural",.6],["VNO",-.8]],pc:-1}]},{q:a("Russian disinformation floods social media before the vote. How do you fight back?","Prie\u0161 rinkimus socialinius tinklus u\u017Elieja Rusijos dezinformacija. Kaip kovosite?"),answers:[{t:a("A media literacy course in every school.","Medij\u0173 ra\u0161tingumo pamokos kiekvienoje mokykloje."),style:"youth",base:6,tags:[["urban",.6]]},{t:a("Block the channels and fine the platforms hard.","Blokuoti kanalus ir skirti platformoms dideles baudas."),style:"security",base:6,axis:["defense",1],tags:[["VNO",.5],["border",.4]]},{t:a("Trust people: free speech, not censorship.","Pasitik\u0117ti \u017Emon\u0117mis: \u017Eod\u017Eio laisv\u0117, ne cenz\u016Bra."),style:"populist",base:5.5,tags:[["rural",.5],["urban",-.3]]}]}]},{title:a("Values, Energy & the Future","Vertyb\u0117s, energetika ir ateitis"),closing:!0,questions:[{q:a("Will your government pass the civil partnership law?","Ar j\u016Bs\u0173 Vyriausyb\u0117 priims partneryst\u0117s \u012Fstatym\u0105?"),answers:[{t:a("Yes: equal recognition for every family.","Taip \u2013 lygios teis\u0117s kiekvienai \u0161eimai."),style:"progressive",base:6,axis:["social",-1],tags:[["urban",1],["rural",-.8]]},{t:a("A narrow cohabitation agreement, not partnership.","Siaura bendro gyvenimo sutartis, ne partneryst\u0117."),style:"moderate",base:6,tags:[["all",.3]]},{t:a("No. We protect the traditional family.","Ne. Ginsime tradicin\u0119 \u0161eim\u0105."),style:"traditional",base:6,axis:["social",1],tags:[["rural",1],["urban",-.8]]}]},{q:a("Energy: offshore wind, a new nuclear plant, or cheap gas?","Energetika: j\u016Bros v\u0117jas, nauja atomin\u0117 ar pigios dujos?"),answers:[{t:a("Offshore wind and solar: green independence.","J\u016Bros v\u0117jas ir saul\u0117 \u2013 \u017Ealioji nepriklausomyb\u0117."),style:"green",base:6,axis:["green",1],tags:[["urban",.7],["KLP",.8]]},{t:a("Small modular reactors at Visaginas.","Ma\u017Ei moduliniai reaktoriai Visagine."),style:"technocrat",base:6,axis:["green",1],tags:[["UTE",2.5]]},{t:a("Keep gas cheap and stop the green experiments.","I\u0161laikyti pigias dujas ir baigti \u017Ealiuosius eksperimentus."),style:"populist",base:6,axis:["green",-1],tags:[["rural",.8],["urban",-.6]]}]},{q:a("Should Lithuania move to a four-day working week?","Ar Lietuvai pereiti prie keturi\u0173 dien\u0173 darbo savait\u0117s?"),answers:[{t:a("Yes, starting with a public-sector pilot next year.","Taip, pradedant bandomuoju projektu vie\u0161ajame sektoriuje kitais metais."),style:"progressive",base:6,axis:["econ",-1],tags:[["urban",.7]]},{t:a("Productivity first. Shorter weeks will follow.","Pirmiausia na\u0161umas. Trumpesn\u0117 savait\u0117 ateis v\u0117liau."),style:"business",base:6,axis:["econ",1],tags:[["urban",.4]]},{t:a("Families need time together: yes, and keep Sundays free.","\u0160eimoms reikia laiko kartu: taip, ir sekmadieniai turi likti laisvi."),style:"traditional",base:5.5,axis:["social",1],tags:[["rural",.6]]},{t:a("Fine, but raise pensions first.","Gerai, bet pirmiausia pakelkime pensijas."),style:"welfare",base:5.5,tags:[["rural",.7]]}]},{q:a("Climate: should petrol and diesel cars be taxed more?","Klimatas: ar benzininius ir dyzelinius automobilius reikia apmokestinti labiau?"),answers:[{t:a("Yes, and spend every cent on public transport.","Taip, ir kiekvien\u0105 cent\u0105 skirti vie\u0161ajam transportui."),style:"green",base:6,axis:["green",1],tags:[["urban",.8],["rural",-.6]]},{t:a("No new taxes on people who must drive to work.","Joki\u0173 nauj\u0173 mokes\u010Di\u0173 tiems, kam \u012F darb\u0105 tenka va\u017Eiuoti automobiliu."),style:"populist",base:6,axis:["green",-1],tags:[["rural",.9],["urban",-.3]]},{t:a("Subsidies for used electric cars instead of penalties.","Vietoj baud\u0173 \u2013 subsidijos naudotiems elektromobiliams."),style:"moderate",base:6,tags:[["all",.4]]},{t:a("Cut fuel excise and let the market decide.","Suma\u017Einti degal\u0173 akciz\u0105 ir leisti spr\u0119sti rinkai."),style:"business",base:5.5,axis:["econ",1],tags:[["rural",.4]]}]},{q:a("Final word. Look into the camera and speak to the undecided.","Paskutinis \u017Eodis. Pa\u017Ei\u016Br\u0117kite \u012F kamer\u0105 ir kreipkit\u0117s \u012F neapsisprendusius."),answers:[{t:a("\u201CLithuania is stronger when we stop shouting at each other.\u201D","\u201ELietuva stipresn\u0117, kai nustojame vieni ant kit\u0173 r\u0117kti.\u201C"),style:"moderate",base:6,tags:[["all",.4]]},{t:a("\u201CThrow out the people who forgot you exist.\u201D","\u201EI\u0161vykite tuos, kurie pamir\u0161o, kad j\u016Bs egzistuojate.\u201C"),style:"populist",base:6,tags:[["rural",.8],["urban",-.4]]},{t:a("\u201CVote for competence. Read our programme.\u201D","\u201EBalsuokite u\u017E kompetencij\u0105. Perskaitykite m\u016Bs\u0173 program\u0105.\u201C"),style:"technocrat",base:6,tags:[["urban",.6]]}]}]}],Me={ALY:{label:[423,519],d:"M374,466L377,468L379,468L381,465L390,466L388,469L394,466L394,461L403,462L408,459L409,456L406,455L409,448L414,446L419,447L421,451L424,449L433,449L434,445L439,445L441,443L443,443L442,448L444,453L456,454L461,453L462,451L464,462L460,464L466,468L463,475L466,474L468,477L480,476L479,478L484,479L485,474L496,470L502,475L501,480L502,484L505,481L520,482L520,479L528,478L528,480L530,476L543,473L543,482L540,482L540,485L530,487L531,490L528,490L531,505L525,505L523,507L525,509L522,510L520,514L517,514L516,515L514,515L515,518L507,520L507,525L516,529L518,539L516,539L518,542L510,547L517,556L517,562L524,565L519,566L519,571L518,570L516,574L510,574L506,580L499,581L500,568L498,568L495,571L490,570L487,574L476,581L468,593L465,594L464,593L464,595L463,593L455,595L453,592L451,594L449,594L441,583L438,585L435,584L434,579L426,583L422,582L421,586L406,589L403,589L402,583L396,580L392,585L388,583L380,588L383,591L380,595L377,595L376,590L368,586L355,589L351,585L345,585L340,580L338,573L344,566L344,558L339,546L338,538L335,533L330,532L324,521L317
